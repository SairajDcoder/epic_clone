<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist - Epic Games Clone</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .wishlist-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 40px 60px;
            color: #fff;
        }

        .wishlist-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .wishlist-title {
            font-size: 32px;
            font-weight: 600;
            margin: 0;
        }

        .epic-rewards-badge {
            color: #a0a0a5;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .epic-rewards-badge .amount {
            border: 1px solid #333;
            border-radius: 20px;
            padding: 4px 12px;
            color: #fff;
        }

        .wishlist-notify-banner {
            background-color: #121212;
            border: 1px solid #333;
            border-left: 4px solid #0078f2;
            border-radius: 4px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .wishlist-notify-banner .text {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: #a0a0a5;
        }

        .wishlist-content {
            display: flex;
            gap: 40px;
        }

        .wishlist-main {
            flex: 1;
        }

        .wishlist-sidebar {
            width: 280px;
            flex-shrink: 0;
        }
        
        .sort-by {
            margin-bottom: 20px;
            font-size: 14px;
            color: #a0a0a5;
        }
        .sort-by span { color: #fff; cursor: pointer; }

        .wishlist-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .wishlist-card {
            background-color: #202024;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            gap: 20px;
            position: relative;
        }

        .wishlist-card img {
            width: 140px;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .wishlist-card-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .wishlist-card-tags {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .wishlist-tag {
            background: #333;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
            color: #a0a0a5;
        }
        
        .wishlist-card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .wishlist-price-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .wishlist-card-actions {
            margin-top: auto;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            padding-top: 15px;
            border-top: 1px solid #333;
        }
        
        .wishlist-remove {
            color: #a0a0a5;
            font-size: 13px;
            background: none;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 600;
            transition: color 0.2s;
        }
        .wishlist-remove:hover { color: #fff; }
        
        .wishlist-add-cart {
            background: #0078f2;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
        }
        .wishlist-add-cart:hover { background: #005bb5; }

        /* Sidebar styling */
        .filter-header {
            font-size: 16px;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }
        .filter-item {
            padding: 15px 0;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
            color: #a0a0a5;
            font-size: 14px;
        }
        
        .toggle-switch-ui {
            width: 40px; height: 22px; background: #333; border-radius: 12px; position: relative; cursor: pointer;
        }
        .toggle-switch-ui::after {
            content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; background: #a0a0a5; border-radius: 50%;
        }

        .removed-toast {
            background: #202024;
            border: 1px solid #333;
            border-left: 4px solid #de3341;
            padding: 12px 20px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            display: none;
        }
        .undo-btn {
            background: transparent;
            border: 1px solid #fff;
            color: #fff;
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        
        .empty-wishlist {
            text-align: center;
            padding: 80px 0;
            color: #a0a0a5;
        }
    </style>
</head>

<body>

    <div class="topbar">
        <div class="left-nav">
            <ul class="menu">
                <li class="logo-item">
                    <a href="#" class="logo-link">
                        <img src="images/logo.png" class="logo">
                        <span class="chevron logo-chevron"></span>
                    </a>
                </li>
                <li><a href="#" class="store-link">STORE</a></li>
                <li><a href="#">Support</a></li>
                <li class="dist-item">
                    <a href="#" class="dist-link">
                        Distribute
                        <span class="chevron dist-chevron"></span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="right-nav">
            <div class="globe">
                <img style="width: 20px;" src="images/globe.png" alt="Select Language">
            </div>
            <a href="login.html" style="text-decoration: none;">
                <button class="signin-btn">Sign In</button>
            </a>
            <button class="download-btn">Download</button>
        </div>
    </div>

    <div class="subnav">
        <div class="search-box">
            <span class="search-icon"><img style="width: 13px;" src="images/search.png" alt=""></span>
            <input type="text" class="search-input" placeholder="Search store">
        </div>

        <ul class="sub-menu">
            <li><a href="index.html">Discover</a></li>
            <li><a href="browse.html">Browse</a></li>
            <li><a href="news.html">News</a></li>
        </ul>

        <div class="subnav-right" style="margin-left: auto; display: flex; gap: 20px; align-items: center; padding-right: 20px;">
            <a href="wishlist.html" style="color: #fff; text-decoration: none; font-size: 14px; font-weight: 500;">Wishlist</a>
            <a href="gifts.html" style="color: #a0a0a5; text-decoration: none; font-size: 14px; transition: color 0.2s;">Gifts</a>
            <a href="cart.html" style="color: #a0a0a5; text-decoration: none; font-size: 14px; transition: color 0.2s;">Cart</a>
        </div>
    </div>

    <!-- Wishlist Specific Content -->
    <div class="wishlist-container">
        
        <div class="wishlist-header-row">
            <h1 class="wishlist-title">My Wishlist</h1>
            <div class="epic-rewards-badge">
                Epic Rewards ↗
                <div class="amount">₹0.00</div>
            </div>
        </div>

        <div class="wishlist-notify-banner">
            <div class="text">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                Get notified when your wishlisted games go on sale, or are available for purchase or pre-purchase.
            </div>
            <div class="toggle-switch-ui"></div>
        </div>

        <div class="wishlist-content">
            <div class="wishlist-main">
                <div class="sort-by">Sort by: <span>On Sale ⌄</span></div>
                
                <div class="removed-toast" id="removedToast">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <svg width="16" height="16" fill="#de3341" viewBox="0 0 16 16"><path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/><path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/></svg>
                        <span id="removedToastText">Game was removed</span>
                    </div>
                    <button class="undo-btn" id="undoRemoveBtn">Undo</button>
                </div>

                <div class="wishlist-grid" id="wishlistGrid">
                    <!-- Loaded dynamically -->
                </div>
            </div>

            <div class="wishlist-sidebar">
                <div class="filter-header">
                    <span>Filters</span>
                </div>
                <div class="filter-item"><span>Genre</span> <span>⌄</span></div>
                <div class="filter-item"><span>Features</span> <span>⌄</span></div>
                <div class="filter-item"><span>Platform</span> <span>⌄</span></div>
            </div>
        </div>
    </div>


    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/auth-nav.js"></script>

    <script>
        $(document).ready(function() {
            var wishlisted = JSON.parse(localStorage.getItem("bookmarkedGames")) || {};
            var $grid = $('#wishlistGrid');
            var lastRemovedTitle = null;
            var lastRemovedData = null;

            function renderWishlist() {
                $grid.empty();
                var hasItems = false;
                
                $.each(wishlisted, function(title, data) {
                    if (data) {
                        hasItems = true;
                        // For backwards compatibility, if the data is just 'true' boolean
                        var imgUrl = typeof data === 'object' ? data.img : 'images/epic/discover/10003.avif';
                        
                        var html = `
                            <div class="wishlist-card">
                                <img src="${imgUrl}" alt="${title}">
                                <div class="wishlist-card-info">
                                    <div class="wishlist-card-tags">
                                        <span class="wishlist-tag">Base Game</span>
                                    </div>
                                    <div class="wishlist-card-title">${title}</div>
                                    <div style="font-size:12px; color:#a0a0a5;">Users Interact, In-Game Purchases</div>
                                    <div class="wishlist-card-actions">
                                        <button class="wishlist-remove" data-title="${title}">Remove</button>
                                        <button class="wishlist-add-cart">Add To Cart</button>
                                    </div>
                                </div>
                                <div class="wishlist-price-badge">Free</div>
                            </div>
                        `;
                        $grid.prepend(html);
                    }
                });

                if (!hasItems) {
                    $grid.html('<div class="empty-wishlist"><h2>You haven\'t added anything to your wishlist yet.</h2><p>Shop for games and add them to your wishlist.</p></div>');
                }
            }

            renderWishlist();

            // Handle Remove
            $(document).on('click', '.wishlist-remove', function() {
                var title = $(this).data('title');
                lastRemovedTitle = title;
                lastRemovedData = wishlisted[title];
                
                delete wishlisted[title];
                localStorage.setItem("bookmarkedGames", JSON.stringify(wishlisted));
                
                renderWishlist();
                
                $('#removedToastText').text(title + ' was removed');
                $('#removedToast').slideDown(200);
            });

            // Handle Undo
            $('#undoRemoveBtn').on('click', function() {
                if (lastRemovedTitle) {
                    wishlisted[lastRemovedTitle] = lastRemovedData;
                    localStorage.setItem("bookmarkedGames", JSON.stringify(wishlisted));
                    renderWishlist();
                    $('#removedToast').slideUp(200);
                    lastRemovedTitle = null;
                }
            });
        });
    </script>
</body>
</html>
