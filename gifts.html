<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gifts - Epic Games Clone</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .gifts-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 40px 60px;
            color: #fff;
            font-family: inherit;
        }

        .gifts-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .gifts-tabs {
            display: flex;
            gap: 25px;
            margin-bottom: 30px;
            border-bottom: 1px solid #202024;
        }

        .gifts-tab {
            color: #a0a0a5;
            font-size: 14px;
            font-weight: 500;
            padding-bottom: 12px;
            cursor: pointer;
            transition: color 0.2s;
            position: relative;
        }
        
        .gifts-tab:hover {
            color: #fff;
        }

        .gifts-tab.active {
            color: #fff;
        }

        .gifts-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #0078f2;
        }

        .gifts-empty-state-box {
            background-color: #202024;
            border-radius: 12px;
            padding: 100px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }

        .gifts-empty-icon {
            color: #0078f2;
            margin-bottom: 24px;
            position: relative;
        }
        
        .gifts-empty-icon::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100px; height: 100px;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .gifts-empty-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .gifts-empty-subtitle {
            color: #a0a0a5;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .gifts-browse-btn {
            background-color: #0078f2;
            color: #121212;
            border: none;
            padding: 14px 28px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
        }
        
        .gifts-browse-btn:hover {
            background-color: #00a4ff;
            color: #121212;
        }
    </style>
</head>

<body>

    <div class="topbar">
        <div class="left-nav">
            <ul class="menu">
                <li class="logo-item">
                    <a href="#" class="logo-link">
                        <img src="images/logo.png" class="logo">
                        <span class="chevron logo-chevron"></span>
                    </a>
                </li>
                <li><a href="#" class="store-link">STORE</a></li>
                <li><a href="#">Support</a></li>
                <li class="dist-item">
                    <a href="#" class="dist-link">
                        Distribute
                        <span class="chevron dist-chevron"></span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="right-nav">
            <div class="globe">
                <img style="width: 20px;" src="images/globe.png" alt="Select Language">
            </div>
            <a href="login.html" style="text-decoration: none;">
                <button class="signin-btn">Sign In</button>
            </a>
            <button class="download-btn">Download</button>
        </div>
    </div>

    <div class="subnav">
        <div class="search-box">
            <span class="search-icon"><img style="width: 13px;" src="images/search.png" alt=""></span>
            <input type="text" class="search-input" placeholder="Search store">
        </div>

        <ul class="sub-menu">
            <li><a href="index.html">Discover</a></li>
            <li><a href="browse.html">Browse</a></li>
            <li><a href="news.html">News</a></li>
        </ul>

        <div class="subnav-right" style="margin-left: auto; display: flex; gap: 20px; align-items: center; padding-right: 20px;">
            <a href="wishlist.html" style="color: #a0a0a5; text-decoration: none; font-size: 14px; transition: color 0.2s;">Wishlist</a>
            <a href="gifts.html" style="color: #fff; text-decoration: none; font-size: 14px; font-weight: 500;">Gifts</a>
            <a href="cart.html" style="color: #a0a0a5; text-decoration: none; font-size: 14px; transition: color 0.2s;">Cart</a>
        </div>
    </div>

    <!-- Gifts Content -->
    <div class="gifts-container">
        <h1 class="gifts-title">Gifts</h1>
        
        <div class="gifts-tabs">
            <div class="gifts-tab active">All</div>
            <div class="gifts-tab">Unopened</div>
            <div class="gifts-tab">Received</div>
            <div class="gifts-tab">Sent</div>
        </div>
        
        <div class="gifts-empty-state-box">
            <div class="gifts-empty-icon">
                <svg viewBox="0 0 24 24" width="60" height="60" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="8" width="18" height="13" rx="1"/>
                    <path d="M12 8v13M3 13h18M12 8V5a3 3 0 0 0-3-3H6M12 8V5a3 3 0 0 1 3-3h3"/>
                </svg>
            </div>
            <div class="gifts-empty-title">No Received or Sent Gifts</div>
            <div class="gifts-empty-subtitle">Games gifted to you will show up here.</div>
            <a href="browse.html" class="gifts-browse-btn">Browse Games</a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/auth-nav.js"></script>
</body>
</html>
